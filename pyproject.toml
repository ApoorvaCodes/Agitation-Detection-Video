[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "person1-video-perception"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8", "pydantic>=2.0,<3"]

[project.optional-dependencies]
# Person 1 uses the legacy mp.solutions.pose API, present in this tested release.
models = ["ultralytics>=8.2", "mediapipe==0.10.21", "lap>=0.5.12"]
test = ["pytest>=8"]
# This range supports MediaPipe's protobuf<5 requirement for video processing.
dashboard = ["streamlit>=1.36,<1.46", "pandas>=2", "plotly>=5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
